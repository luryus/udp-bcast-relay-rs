[package]
name = "udp-bcast-relay-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.16", features = ["cargo"] }
libc = "0.2.174"
log = "0.4.22"
netdev = "0.36.0"
socket2 = { version = "0.6.0", features = ["all"] }
stderrlog = { version = "0.6.0", default-features = false }

[dev-dependencies]
etherparse = "0.18.0"
